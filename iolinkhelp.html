<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IO-Link Network Troubleshooter</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow:wght@300;400;600;700&display=swap');

  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #21262d;
    --border: #30363d;
    --accent: #f0a500;
    --accent2: #00d4aa;
    --danger: #ff4757;
    --info: #4a9eff;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --power-color: #ff6b35;
    --eth-color: #4a9eff;
    --mono: 'Share Tech Mono', monospace;
    --sans: 'Barlow', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(240,165,0,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(240,165,0,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none; z-index: 0;
  }

  #app { position: relative; z-index: 1; }

  /* ── HEADER ── */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 13px 24px; background: var(--surface);
    border-bottom: 2px solid var(--accent);
    gap: 16px; flex-wrap: wrap;
    position: sticky; top: 0; z-index: 200;
  }
  .header-brand { display: flex; align-items: center; gap: 12px; }
  .logo-mark {
    width: 34px; height: 34px; background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-weight: bold; color: #000; font-size: 12px;
    clip-path: polygon(0 0, calc(100% - 7px) 0, 100% 7px, 100% 100%, 7px 100%, 0 calc(100% - 7px));
  }
  header h1 { font-family: var(--mono); font-size: 16px; color: var(--accent); letter-spacing: 2px; text-transform: uppercase; }
  header p  { font-size: 10px; color: var(--text-dim); letter-spacing: 1px; text-transform: uppercase; }
  .header-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .btn {
    font-family: var(--mono); font-size: 11px; padding: 6px 13px;
    border: 1px solid var(--border); background: var(--surface2); color: var(--text);
    cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: all 0.15s;
    clip-path: polygon(0 0, calc(100% - 5px) 0, 100% 5px, 100% 100%, 5px 100%, 0 calc(100% - 5px));
  }
  .btn:hover { background: var(--border); }
  .btn.primary { border-color: var(--accent); color: var(--accent); }
  .btn.primary:hover { background: rgba(240,165,0,0.15); }

  /* ── MAIN ── */
  main { padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; overflow-x: auto; }

  /* ── LEGEND ── */
  .legend {
    display: flex; gap: 16px; flex-wrap: wrap;
    padding: 10px 16px; background: var(--surface); border: 1px solid var(--border);
    align-items: center; flex-shrink: 0;
  }
  .legend-title { font-family: var(--mono); font-size: 9px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 2px; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: 9px; color: var(--text-dim); }
  .legend-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .legend-dash { width: 18px; height: 0; border-top: 2px dashed; flex-shrink: 0; }

  /* ── PANEL SOURCE BAR ── */
  .panel-bar {
    display: flex; align-items: center; gap: 20px;
    padding: 10px 16px;
    background: var(--surface); border: 1px solid var(--border);
    border-left: 4px solid var(--accent);
    flex-shrink: 0; flex-wrap: wrap;
  }
  .panel-bar-label { font-family: var(--mono); font-size: 9px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
  .editable-badge {
    font-family: var(--mono); font-size: 12px; font-weight: 700;
    padding: 3px 10px; border: 1px solid; cursor: pointer;
    transition: all 0.15s;
  }
  .editable-badge.pwr { color: var(--power-color); border-color: rgba(255,107,53,0.5); background: rgba(255,107,53,0.07); }
  .editable-badge.pwr:hover { background: rgba(255,107,53,0.15); }
  .editable-badge.eth { color: var(--eth-color); border-color: rgba(74,158,255,0.5); background: rgba(74,158,255,0.07); }
  .editable-badge.eth:hover { background: rgba(74,158,255,0.15); }
  .panel-bar-hint { font-family: var(--mono); font-size: 9px; color: var(--text-dim); margin-left: auto; }

  /* ── CANVAS: rows of chains ── */
  #canvas { display: flex; flex-direction: column; gap: 16px; }

  /* ── CHAIN ROW ── */
  .chain-row {
    display: flex; align-items: flex-start; gap: 0;
    position: relative;
  }

  /* Panel stub styles are defined in the connector section above */

  /* Add-to-row button */
  .add-to-row-btn {
    display: flex; align-items: center; justify-content: center;
    width: 38px; align-self: stretch; min-height: 80px;
    background: transparent; border: 1px dashed var(--border);
    color: var(--text-dim); font-size: 18px; cursor: pointer;
    flex-shrink: 0; transition: all 0.15s;
  }
  .add-to-row-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(240,165,0,0.04); }

  /* Add new row button */
  .add-row-btn {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 18px;
    background: transparent; border: 1px dashed var(--border);
    color: var(--text-dim); font-family: var(--mono); font-size: 11px;
    cursor: pointer; text-transform: uppercase; letter-spacing: 1px;
    transition: all 0.15s; width: fit-content;
  }
  .add-row-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(240,165,0,0.04); }

  /* ── CONNECTOR BETWEEN MODULES ── */
  .chain-connector {
    display: flex; flex-direction: column; justify-content: flex-start;
    padding-top: 60px; gap: 0px;
    flex-shrink: 0; width: 80px;
  }

  .cable-slot {
    display: flex; flex-direction: column; align-items: stretch;
    position: relative; height: 28px; justify-content: center;
  }

  .conn-line {
    height: 3px; width: 100%; position: relative; flex-shrink: 0;
  }
  .conn-line.pwr-on  { background: linear-gradient(90deg, var(--power-color), rgba(255,107,53,0.5)); }
  .conn-line.eth-on  { background: linear-gradient(90deg, var(--eth-color),   rgba(74,158,255,0.5)); }
  .conn-line.off     { background: var(--border); opacity: 0.4; }
  .conn-line.pwr-on::after, .conn-line.eth-on::after, .conn-line.off::after {
    content: ''; position: absolute; right: -1px; top: -3.5px;
    width: 0; height: 0;
    border-top: 5px solid transparent; border-bottom: 5px solid transparent;
  }
  .conn-line.pwr-on::after  { border-left: 7px solid var(--power-color); }
  .conn-line.eth-on::after  { border-left: 7px solid var(--eth-color); }
  .conn-line.off::after     { border-left: 7px solid var(--border); }

  /* Cable label tag sits on the wire */
  .cable-label-wrap {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    z-index: 10;
  }
  .cable-label-input {
    font-family: var(--mono); font-size: 8px;
    background: var(--surface2);
    border: 1px solid;
    color: var(--text);
    padding: 1px 4px;
    width: 64px;
    text-align: center;
    display: block;
    letter-spacing: 0.5px;
    transition: all 0.15s;
  }
  .cable-label-input.pwr-label {
    border-color: rgba(255,107,53,0.6);
    color: var(--power-color);
    background: rgba(13,17,23,0.92);
  }
  .cable-label-input.eth-label {
    border-color: rgba(74,158,255,0.6);
    color: var(--eth-color);
    background: rgba(13,17,23,0.92);
  }
  .cable-label-input.off-label {
    border-color: var(--border);
    color: var(--text-dim);
    background: rgba(13,17,23,0.92);
    opacity: 0.5;
  }
  .cable-label-input:focus {
    outline: none;
    width: 72px;
  }
  .cable-label-input.pwr-label:focus { border-color: var(--power-color); color: var(--power-color); }
  .cable-label-input.eth-label:focus { border-color: var(--eth-color);   color: var(--eth-color); }
  .cable-label-input::placeholder { color: var(--text-dim); font-style: italic; opacity: 0.6; }

  /* Panel stub also needs wider width to show labels */
  .panel-stub {
    display: flex; flex-direction: column; justify-content: flex-start;
    align-items: stretch;
    padding-top: 60px;
    gap: 0px;
    width: 80px; flex-shrink: 0;
    position: relative;
  }
  .panel-stub::after {
    content: 'PANEL';
    position: absolute; bottom: 0; left: 0; right: 0;
    text-align: center;
    font-family: var(--mono); font-size: 8px; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 1px;
    padding-bottom: 6px;
  }
  .stub-line {
    width: 100%; height: 3px; position: relative; flex-shrink: 0;
  }
  .stub-line.pwr { background: linear-gradient(90deg, var(--power-color) 60%, transparent); }
  .stub-line.eth { background: linear-gradient(90deg, var(--eth-color)   60%, transparent); }
  .stub-line::after {
    content: ''; position: absolute; right: -1px; top: -3.5px;
    width: 0; height: 0;
    border-top: 5px solid transparent;
    border-bottom: 5px solid transparent;
  }
  .stub-line.pwr::after { border-left: 7px solid var(--power-color); }
  .stub-line.eth::after { border-left: 7px solid var(--eth-color); }

  /* ── MODULE CARD ── */
  .module-card {
    background: var(--surface);
    border: 1px solid var(--border);
    width: 300px; flex-shrink: 0;
    position: relative;
    animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateX(-6px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  .module-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, var(--accent), transparent);
  }

  /* Module header */
  .module-header {
    display: flex; align-items: center; padding: 8px 11px; gap: 7px;
    border-bottom: 1px solid var(--border); background: var(--surface2);
  }
  .module-id { font-family: var(--mono); font-size: 9px; color: var(--text-dim); flex-shrink: 0; }
  .module-name-input {
    background: transparent; border: none; border-bottom: 1px dashed var(--border);
    color: var(--text); font-family: var(--mono); font-size: 12px; font-weight: 600;
    flex: 1; padding: 1px 3px; letter-spacing: 1px; text-transform: uppercase;
    min-width: 0;
  }
  .module-name-input:focus { outline: none; border-bottom-color: var(--accent); color: var(--accent); }
  .module-delete {
    background: none; border: none; color: var(--text-dim); cursor: pointer;
    font-size: 12px; padding: 1px 3px; transition: color 0.15s; flex-shrink: 0;
  }
  .module-delete:hover { color: var(--danger); }

  /* IP address bar */
  .module-ip-bar {
    display: flex; align-items: center; gap: 7px;
    padding: 5px 11px; border-bottom: 1px solid var(--border);
    background: rgba(74,158,255,0.04);
  }
  .ip-label { font-family: var(--mono); font-size: 9px; color: var(--eth-color); text-transform: uppercase; letter-spacing: 1px; flex-shrink: 0; }
  .ip-input {
    font-family: var(--mono); font-size: 11px;
    background: transparent; border: none; border-bottom: 1px dashed rgba(74,158,255,0.3);
    color: var(--text); padding: 1px 3px; flex: 1; min-width: 0;
  }
  .ip-input:focus { outline: none; border-bottom-color: var(--eth-color); color: var(--eth-color); }
  .ip-input::placeholder { color: var(--text-dim); }

  /* Connection ports */
  .conn-ports { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 1px solid var(--border); }
  .conn-group { padding: 7px 9px; border-right: 1px solid var(--border); display: flex; flex-direction: column; gap: 4px; }
  .conn-group:last-child { border-right: none; }
  .conn-group-title { font-family: var(--mono); font-size: 8px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 2px; }
  .conn-group-title.pwr { color: var(--power-color); }
  .conn-group-title.eth { color: var(--eth-color); }

  .port-row { display: flex; align-items: center; gap: 4px; }
  .port-badge { font-family: var(--mono); font-size: 7px; padding: 1px 4px; border: 1px solid; text-transform: uppercase; flex-shrink: 0; }
  .port-badge.p-in  { border-color: rgba(255,107,53,0.5); color: var(--power-color); background: rgba(255,107,53,0.06); }
  .port-badge.p-out { border-color: rgba(255,107,53,0.5); color: var(--power-color); background: rgba(255,107,53,0.06); }
  .port-badge.e-in  { border-color: rgba(74,158,255,0.5); color: var(--eth-color);   background: rgba(74,158,255,0.06); }
  .port-badge.e-out { border-color: rgba(74,158,255,0.5); color: var(--eth-color);   background: rgba(74,158,255,0.06); }

  .port-name-editable {
    font-family: var(--mono); font-size: 10px; color: var(--text-dim);
    cursor: pointer; border-bottom: 1px dashed transparent; transition: all 0.15s;
    flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .port-name-editable:hover { border-bottom-color: var(--border); color: var(--text); }

  .jumper-row { display: flex; align-items: center; gap: 4px; margin-top: 1px; }
  .jumper-chk {
    appearance: none; width: 24px; height: 12px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 2px; cursor: pointer; position: relative; transition: all 0.2s; flex-shrink: 0;
  }
  .jumper-chk:checked { background: rgba(240,165,0,0.2); border-color: var(--accent); }
  .jumper-chk::after { content: ''; position: absolute; top: 2px; left: 2px; width: 6px; height: 6px; background: var(--text-dim); transition: all 0.2s; }
  .jumper-chk:checked::after { left: 14px; background: var(--accent); }
  .jumper-lbl { font-family: var(--mono); font-size: 7px; color: var(--text-dim); text-transform: uppercase; }
  .jumper-lbl.on { color: var(--accent); }

  /* IO Ports */
  .io-ports { padding: 6px; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .io-port { border: 1px solid var(--border); padding: 5px 6px; position: relative; transition: border-color 0.15s; }
  .io-port.t-input   { border-left: 3px solid var(--info); }
  .io-port.t-output  { border-left: 3px solid var(--accent2); }
  .io-port.t-iolink  { border-left: 3px solid var(--accent); }

  .port-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 3px; }
  .port-number { font-family: var(--mono); font-size: 8px; color: var(--text-dim); text-transform: uppercase; }
  .status-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
  .io-port.t-input  .status-dot { background: var(--info);    box-shadow: 0 0 4px var(--info); }
  .io-port.t-output .status-dot { background: var(--accent2); box-shadow: 0 0 4px var(--accent2); }
  .io-port.t-iolink .status-dot { background: var(--accent);  box-shadow: 0 0 4px var(--accent); }

  .port-type-select {
    font-family: var(--mono); font-size: 9px;
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); padding: 2px 3px; width: 100%; margin-bottom: 3px; cursor: pointer;
  }
  .device-row { display: flex; align-items: center; gap: 4px; margin-bottom: 3px; }
  .device-icon { width: 20px; height: 20px; flex-shrink: 0; }
  .port-device-select {
    font-family: var(--mono); font-size: 8px;
    background: rgba(240,165,0,0.07); border: 1px solid rgba(240,165,0,0.3);
    color: var(--accent); padding: 2px 3px; flex: 1; cursor: pointer;
  }
  .port-name-input {
    font-family: var(--mono); font-size: 9px;
    background: transparent; border: none; border-bottom: 1px dashed var(--border);
    color: var(--text); padding: 1px 2px; width: 100%;
  }
  .port-name-input:focus { outline: none; border-bottom-color: var(--accent); color: var(--accent); }
  .port-name-input::placeholder { color: var(--text-dim); font-style: italic; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="header-brand">
      <div class="logo-mark">IOL</div>
      <div>
        <h1>IO-Link Troubleshooter</h1>
        <p>Network Diagnostic Flow Diagram</p>
      </div>
    </div>
    <div class="header-controls">
      <button class="btn primary" onclick="addChainRow()">+ New Panel Feed</button>
      <button class="btn" onclick="saveLayout()">Export JSON</button>
      <button class="btn" onclick="importLayout()">Import JSON</button>
    </div>
  </header>

  <main>
    <!-- Legend -->
    <div class="legend">
      <span class="legend-title">Legend:</span>
      <span class="legend-item"><span class="legend-dot" style="background:#4a9eff;box-shadow:0 0 4px #4a9eff"></span>Input</span>
      <span class="legend-item"><span class="legend-dot" style="background:#00d4aa;box-shadow:0 0 4px #00d4aa"></span>Output</span>
      <span class="legend-item"><span class="legend-dot" style="background:#f0a500;box-shadow:0 0 4px #f0a500"></span>IO-Link</span>
      <span class="legend-item"><span class="legend-dash" style="border-color:#ff6b35"></span>Power</span>
      <span class="legend-item"><span class="legend-dash" style="border-color:#4a9eff"></span>Ethernet</span>
      <span class="legend-item" style="margin-left:auto;font-size:9px;color:var(--text-dim);">Each row = one panel feed &nbsp;|&nbsp; Port 1 IN → Port 2 OUT → next &nbsp;|&nbsp; Type on cable lines to label wires</span>
    </div>

    <!-- Panel source names -->
    <div class="panel-bar">
      <span class="panel-bar-label">Panel sources:</span>
      <div style="display:flex;align-items:center;gap:6px;">
        <span style="font-family:var(--mono);font-size:9px;color:var(--power-color);text-transform:uppercase;">⚡</span>
        <span class="editable-badge pwr" id="panel-pwr" title="Click to rename" onclick="renameBadge('panel-pwr')">PANEL</span>
      </div>
      <div style="display:flex;align-items:center;gap:6px;">
        <span style="font-family:var(--mono);font-size:9px;color:var(--eth-color);text-transform:uppercase;">⬡</span>
        <span class="editable-badge eth" id="panel-eth" title="Click to rename" onclick="renameBadge('panel-eth')">SWITCH</span>
      </div>
      <span class="panel-bar-hint">Click labels to rename</span>
    </div>

    <!-- Canvas: rows -->
    <div id="canvas"></div>
  </main>
</div>

<script>
// Data model: array of "chains" (rows), each chain is an array of modules
let chains = [];
let moduleIdCounter = 0;

const DEVICE_TYPES = ['None', 'Touch Button Light', 'Rail & Status Light', 'RFID Sensor'];
const PORT_TYPES   = ['Input', 'Output', 'IO-Link'];

const DEVICE_ICONS = {
  'None': `<svg viewBox="0 0 24 24" fill="none" stroke="#8b949e" stroke-width="1.5" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="9"/><line x1="9" y1="12" x2="15" y2="12"/></svg>`,
  'Touch Button Light': `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="9" r="5" fill="rgba(240,165,0,0.12)" stroke="#f0a500" stroke-width="1.5"/><circle cx="12" cy="9" r="2.5" fill="#f0a500"/><path d="M9 16 Q12 13.5 15 16" stroke="#f0a500" stroke-width="1.5" fill="none" stroke-linecap="round"/><line x1="12" y1="14" x2="12" y2="16" stroke="#f0a500" stroke-width="1.5"/><line x1="9.5" y1="19" x2="14.5" y2="19" stroke="#f0a500" stroke-width="1.5" stroke-linecap="round"/></svg>`,
  'Rail & Status Light': `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="2" y="9" width="20" height="7" rx="1.5" fill="rgba(0,212,170,0.08)" stroke="#00d4aa" stroke-width="1.2"/><circle cx="6.5" cy="12.5" r="2" fill="#00d4aa"/><circle cx="12" cy="12.5" r="2" fill="#f0a500"/><circle cx="17.5" cy="12.5" r="2" fill="#ff4757"/><line x1="2" y1="7" x2="22" y2="7" stroke="#00d4aa" stroke-width="1.8" stroke-linecap="round"/><line x1="2" y1="18" x2="22" y2="18" stroke="#00d4aa" stroke-width="1.8" stroke-linecap="round"/></svg>`,
  'RFID Sensor': `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="8" y="8" width="8" height="8" rx="1.5" fill="rgba(74,158,255,0.12)" stroke="#4a9eff" stroke-width="1.2"/><circle cx="12" cy="12" r="1.8" fill="#4a9eff"/><path d="M5.5 7.5 Q5.5 3 12 3 Q18.5 3 18.5 7.5" stroke="#4a9eff" stroke-width="1.2" fill="none" opacity="0.5"/><path d="M5.5 16.5 Q5.5 21 12 21 Q18.5 21 18.5 16.5" stroke="#4a9eff" stroke-width="1.2" fill="none" opacity="0.5"/><path d="M3 10 Q3 5.5 12 5.5 Q21 5.5 21 10" stroke="#4a9eff" stroke-width="1" fill="none" opacity="0.3" stroke-dasharray="2 1.5"/><path d="M3 14 Q3 18.5 12 18.5 Q21 18.5 21 14" stroke="#4a9eff" stroke-width="1" fill="none" opacity="0.3" stroke-dasharray="2 1.5"/></svg>`
};

function createModule() {
  moduleIdCounter++;
  return {
    id: moduleIdCounter,
    name: `Module ${moduleIdCounter}`,
    ip: '',
    pwrCableLabel: '',
    ethCableLabel: '',
    pwr1Name: 'PWR IN',
    pwr2Name: 'PWR OUT',
    pwr2Jumpered: false,
    eth1Name: 'ETH IN',
    eth2Name: 'ETH OUT',
    eth2Jumpered: false,
    ports: Array.from({length: 8}, (_, i) => ({
      number: i + 1,
      type: 'Input',
      device: 'None',
      name: ''
    }))
  };
}

function createChain() {
  return { id: Date.now(), modules: [createModule()] };
}

/* ── RENDER ── */
function renderAll() {
  const canvas = document.getElementById('canvas');
  canvas.innerHTML = '';

  chains.forEach(chain => {
    canvas.appendChild(buildChainRow(chain));
  });

  // "Add new panel feed" button at bottom
  const addRowBtn = document.createElement('button');
  addRowBtn.className = 'add-row-btn';
  addRowBtn.innerHTML = `<span style="font-size:18px">+</span> New Panel Feed`;
  addRowBtn.onclick = addChainRow;
  canvas.appendChild(addRowBtn);
}

function buildChainRow(chain) {
  const row = document.createElement('div');
  row.className = 'chain-row';
  row.dataset.chainId = chain.id;

  // Panel stub on the left — shows the first module's cable labels
  const firstMod = chain.modules[0];
  row.appendChild(buildPanelStub(firstMod));

  // Modules with connectors between them
  chain.modules.forEach((mod, idx) => {
    if (idx === 0) {
      // First connector from panel stub: labels belong to mod (incoming cable)
      row.appendChild(buildConnector(true, true, mod));
    } else {
      const prev = chain.modules[idx - 1];
      // Cable labels live on the destination module (incoming side)
      row.appendChild(buildConnector(prev.pwr2Jumpered, prev.eth2Jumpered, mod));
    }
    row.appendChild(buildModuleCard(mod, chain));
  });

  // Add module button at end of row
  const addBtn = document.createElement('button');
  addBtn.className = 'add-to-row-btn';
  addBtn.title = 'Add module to this row';
  addBtn.textContent = '+';
  addBtn.onclick = () => {
    chain.modules.push(createModule());
    renderAll();
  };
  row.appendChild(addBtn);

  return row;
}

function buildPanelStub(firstMod) {
  const stub = document.createElement('div');
  stub.className = 'panel-stub';

  // Power line + label
  const pwrSlot = document.createElement('div');
  pwrSlot.className = 'cable-slot';
  const pwrLine = document.createElement('div');
  pwrLine.className = 'stub-line pwr';
  pwrSlot.appendChild(pwrLine);
  stub.appendChild(pwrSlot);

  // Eth line + label
  const ethSlot = document.createElement('div');
  ethSlot.className = 'cable-slot';
  const ethLine = document.createElement('div');
  ethLine.className = 'stub-line eth';
  ethSlot.appendChild(ethLine);
  stub.appendChild(ethSlot);

  return stub;
}

function buildConnector(pwrOn, ethOn, mod) {
  const wrap = document.createElement('div');
  wrap.className = 'chain-connector';

  // Power cable slot
  const pwrSlot = document.createElement('div');
  pwrSlot.className = 'cable-slot';

  const pwrLine = document.createElement('div');
  pwrLine.className = `conn-line ${pwrOn ? 'pwr-on' : 'off'}`;
  pwrSlot.appendChild(pwrLine);

  // Power cable label tag
  const pwrLabelWrap = document.createElement('div');
  pwrLabelWrap.className = 'cable-label-wrap';
  const pwrLabelInp = document.createElement('input');
  pwrLabelInp.className = `cable-label-input ${pwrOn ? 'pwr-label' : 'off-label'}`;
  pwrLabelInp.placeholder = 'PWR cable…';
  pwrLabelInp.value = mod ? (mod.pwrCableLabel || '') : '';
  pwrLabelInp.title = 'Cable label';
  if (mod) pwrLabelInp.oninput = e => { mod.pwrCableLabel = e.target.value; };
  pwrLabelWrap.appendChild(pwrLabelInp);
  pwrSlot.appendChild(pwrLabelWrap);
  wrap.appendChild(pwrSlot);

  // Ethernet cable slot
  const ethSlot = document.createElement('div');
  ethSlot.className = 'cable-slot';

  const ethLine = document.createElement('div');
  ethLine.className = `conn-line ${ethOn ? 'eth-on' : 'off'}`;
  ethSlot.appendChild(ethLine);

  // Ethernet cable label tag
  const ethLabelWrap = document.createElement('div');
  ethLabelWrap.className = 'cable-label-wrap';
  const ethLabelInp = document.createElement('input');
  ethLabelInp.className = `cable-label-input ${ethOn ? 'eth-label' : 'off-label'}`;
  ethLabelInp.placeholder = 'ETH cable…';
  ethLabelInp.value = mod ? (mod.ethCableLabel || '') : '';
  ethLabelInp.title = 'Cable label';
  if (mod) ethLabelInp.oninput = e => { mod.ethCableLabel = e.target.value; };
  ethLabelWrap.appendChild(ethLabelInp);
  ethSlot.appendChild(ethLabelWrap);
  wrap.appendChild(ethSlot);

  return wrap;
}

function buildModuleCard(mod, chain) {
  const card = document.createElement('div');
  card.className = 'module-card';
  card.dataset.modId = mod.id;

  // ── Header
  const hdr = document.createElement('div');
  hdr.className = 'module-header';

  const idSpan = document.createElement('span');
  idSpan.className = 'module-id';
  idSpan.textContent = `#${mod.id}`;

  const nameInp = document.createElement('input');
  nameInp.className = 'module-name-input';
  nameInp.value = mod.name;
  nameInp.placeholder = 'Module name...';
  nameInp.oninput = e => { mod.name = e.target.value; };

  const delBtn = document.createElement('button');
  delBtn.className = 'module-delete';
  delBtn.innerHTML = '✕';
  delBtn.title = 'Remove module';
  delBtn.onclick = () => {
    chain.modules = chain.modules.filter(m => m.id !== mod.id);
    if (chain.modules.length === 0) {
      chains = chains.filter(c => c.id !== chain.id);
    }
    renderAll();
  };

  hdr.appendChild(idSpan);
  hdr.appendChild(nameInp);
  hdr.appendChild(delBtn);
  card.appendChild(hdr);

  // ── IP Address bar
  const ipBar = document.createElement('div');
  ipBar.className = 'module-ip-bar';
  const ipLbl = document.createElement('span');
  ipLbl.className = 'ip-label';
  ipLbl.textContent = '⬡ IP:';
  const ipInp = document.createElement('input');
  ipInp.className = 'ip-input';
  ipInp.value = mod.ip;
  ipInp.placeholder = '192.168.1.___';
  ipInp.oninput = e => { mod.ip = e.target.value; };
  ipBar.appendChild(ipLbl);
  ipBar.appendChild(ipInp);
  card.appendChild(ipBar);

  // ── Conn ports (power + eth)
  const connPorts = document.createElement('div');
  connPorts.className = 'conn-ports';
  connPorts.appendChild(buildConnGroup(mod, 'pwr'));
  connPorts.appendChild(buildConnGroup(mod, 'eth'));
  card.appendChild(connPorts);

  // ── IO Ports
  const ioSection = document.createElement('div');
  ioSection.className = 'io-ports';
  mod.ports.forEach(port => ioSection.appendChild(buildIOPort(port)));
  card.appendChild(ioSection);

  return card;
}

function buildConnGroup(mod, type) {
  const isPwr = type === 'pwr';
  const group = document.createElement('div');
  group.className = 'conn-group';

  const title = document.createElement('div');
  title.className = `conn-group-title ${type}`;
  title.textContent = isPwr ? '⚡ Power' : '⬡ Ethernet';
  group.appendChild(title);

  // Port 1 IN
  const row1 = document.createElement('div');
  row1.className = 'port-row';
  const badge1 = document.createElement('span');
  badge1.className = `port-badge ${isPwr ? 'p-in' : 'e-in'}`;
  badge1.textContent = 'P1 IN';
  const name1Key = isPwr ? 'pwr1Name' : 'eth1Name';
  const n1 = document.createElement('span');
  n1.className = 'port-name-editable';
  n1.textContent = mod[name1Key];
  n1.title = 'Click to rename';
  n1.onclick = () => { const v = prompt('Rename:', mod[name1Key]); if (v?.trim()) { mod[name1Key] = v.trim(); renderAll(); } };
  row1.appendChild(badge1); row1.appendChild(n1);
  group.appendChild(row1);

  // Port 2 OUT
  const row2 = document.createElement('div');
  row2.className = 'port-row';
  const badge2 = document.createElement('span');
  badge2.className = `port-badge ${isPwr ? 'p-out' : 'e-out'}`;
  badge2.textContent = 'P2 OUT';
  const name2Key = isPwr ? 'pwr2Name' : 'eth2Name';
  const n2 = document.createElement('span');
  n2.className = 'port-name-editable';
  n2.textContent = mod[name2Key];
  n2.title = 'Click to rename';
  n2.onclick = () => { const v = prompt('Rename:', mod[name2Key]); if (v?.trim()) { mod[name2Key] = v.trim(); renderAll(); } };
  row2.appendChild(badge2); row2.appendChild(n2);
  group.appendChild(row2);

  // Jumper toggle
  const jumperKey = isPwr ? 'pwr2Jumpered' : 'eth2Jumpered';
  const jRow = document.createElement('div');
  jRow.className = 'jumper-row';
  const chk = document.createElement('input');
  chk.type = 'checkbox';
  chk.className = 'jumper-chk';
  chk.checked = mod[jumperKey];
  chk.onchange = e => { mod[jumperKey] = e.target.checked; renderAll(); };
  const jLbl = document.createElement('span');
  jLbl.className = `jumper-lbl${mod[jumperKey] ? ' on' : ''}`;
  jLbl.textContent = mod[jumperKey] ? '↗ JUMPER ON' : 'JUMPER OFF';
  jRow.appendChild(chk); jRow.appendChild(jLbl);
  group.appendChild(jRow);

  return group;
}

function buildIOPort(port) {
  const cls = port.type === 'IO-Link' ? 't-iolink' : `t-${port.type.toLowerCase()}`;
  const div = document.createElement('div');
  div.className = `io-port ${cls}`;

  const top = document.createElement('div');
  top.className = 'port-top';
  const num = document.createElement('span');
  num.className = 'port-number';
  num.textContent = `Port ${port.number}`;
  const dot = document.createElement('div');
  dot.className = 'status-dot';
  top.appendChild(num); top.appendChild(dot);
  div.appendChild(top);

  const typeSelect = document.createElement('select');
  typeSelect.className = 'port-type-select';
  PORT_TYPES.forEach(t => {
    const opt = document.createElement('option');
    opt.value = t; opt.textContent = t;
    if (t === port.type) opt.selected = true;
    typeSelect.appendChild(opt);
  });
  typeSelect.onchange = e => {
    port.type = e.target.value;
    if (port.type !== 'IO-Link') port.device = 'None';
    renderAll();
  };
  div.appendChild(typeSelect);

  if (port.type === 'IO-Link') {
    const devRow = document.createElement('div');
    devRow.className = 'device-row';
    const iconDiv = document.createElement('div');
    iconDiv.className = 'device-icon';
    iconDiv.innerHTML = DEVICE_ICONS[port.device] || DEVICE_ICONS['None'];
    const devSelect = document.createElement('select');
    devSelect.className = 'port-device-select';
    DEVICE_TYPES.forEach(d => {
      const opt = document.createElement('option');
      opt.value = d; opt.textContent = d === 'None' ? '— Device type' : d;
      if (d === port.device) opt.selected = true;
      devSelect.appendChild(opt);
    });
    devSelect.onchange = e => {
      port.device = e.target.value;
      iconDiv.innerHTML = DEVICE_ICONS[port.device] || DEVICE_ICONS['None'];
    };
    devRow.appendChild(iconDiv); devRow.appendChild(devSelect);
    div.appendChild(devRow);
  }

  const nameInp = document.createElement('input');
  nameInp.className = 'port-name-input';
  nameInp.placeholder = port.type === 'IO-Link' ? 'Label device...' : 'Label port...';
  nameInp.value = port.name;
  nameInp.oninput = e => { port.name = e.target.value; };
  div.appendChild(nameInp);

  return div;
}

/* ── ACTIONS ── */
function addChainRow() {
  chains.push(createChain());
  renderAll();
}

function renameBadge(id) {
  const el = document.getElementById(id);
  const n = prompt('Rename:', el.textContent);
  if (n?.trim()) el.textContent = n.trim().toUpperCase();
}

function saveLayout() {
  const data = {
    panelPwr: document.getElementById('panel-pwr').textContent,
    panelEth: document.getElementById('panel-eth').textContent,
    chains
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'iolink-layout.json';
  a.click();
}

function importLayout() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json';
  input.onchange = e => {
    const reader = new FileReader();
    reader.onload = evt => {
      try {
        const data = JSON.parse(evt.target.result);
        if (data.panelPwr) document.getElementById('panel-pwr').textContent = data.panelPwr;
        if (data.panelEth) document.getElementById('panel-eth').textContent = data.panelEth;
        chains = data.chains || data; // support old format
        moduleIdCounter = Math.max(...chains.flatMap(c => c.modules.map(m => m.id)), 0);
        renderAll();
      } catch { alert('Invalid JSON file.'); }
    };
    reader.readAsText(e.target.files[0]);
  };
  input.click();
}

/* ── INIT ── */
addChainRow();
</script>
</body>
</html>
