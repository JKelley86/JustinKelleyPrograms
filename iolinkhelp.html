<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IO-Link Network Troubleshooter</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow:wght@300;400;600;700&display=swap');

  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #21262d;
    --border: #30363d;
    --accent: #f0a500;
    --accent2: #00d4aa;
    --danger: #ff4757;
    --info: #4a9eff;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --power-color: #ff6b35;
    --eth-color: #4a9eff;
    --mono: 'Share Tech Mono', monospace;
    --sans: 'Barlow', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(240,165,0,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(240,165,0,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none; z-index: 0;
  }

  #app { position: relative; z-index: 1; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 28px; background: var(--surface);
    border-bottom: 2px solid var(--accent);
    gap: 16px; flex-wrap: wrap;
    position: sticky; top: 0; z-index: 100;
  }

  .header-brand { display: flex; align-items: center; gap: 12px; }

  .logo-mark {
    width: 36px; height: 36px; background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-weight: bold; color: #000; font-size: 13px;
    clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px));
  }

  header h1 { font-family: var(--mono); font-size: 17px; color: var(--accent); letter-spacing: 2px; text-transform: uppercase; }
  header p  { font-size: 11px; color: var(--text-dim); letter-spacing: 1px; text-transform: uppercase; }

  .header-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  .btn {
    font-family: var(--mono); font-size: 11px; padding: 7px 14px;
    border: 1px solid var(--border); background: var(--surface2); color: var(--text);
    cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: all 0.15s;
    clip-path: polygon(0 0, calc(100% - 5px) 0, 100% 5px, 100% 100%, 5px 100%, 0 calc(100% - 5px));
  }
  .btn:hover { background: var(--border); }
  .btn.primary { border-color: var(--accent); color: var(--accent); }
  .btn.primary:hover { background: rgba(240,165,0,0.15); }

  main { padding: 24px 28px; display: flex; flex-direction: column; gap: 20px; }

  /* LEGEND */
  .legend {
    display: flex; gap: 18px; flex-wrap: wrap;
    padding: 11px 18px; background: var(--surface); border: 1px solid var(--border);
    align-items: center;
  }
  .legend-title { font-family: var(--mono); font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 2px; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: 10px; color: var(--text-dim); }
  .legend-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .legend-dash { width: 20px; height: 0; border-top: 2px dashed; flex-shrink: 0; }

  /* FLOW AREA */
  .flow-area {
    display: flex; align-items: flex-start; gap: 0;
    overflow-x: auto; padding-bottom: 20px; padding-top: 4px;
    min-height: 300px;
  }

  /* PANEL BLOCK */
  .panel-block {
    background: var(--surface); border: 1px solid var(--accent);
    border-left: 4px solid var(--accent);
    padding: 14px 14px; min-width: 110px; flex-shrink: 0;
    display: flex; flex-direction: column; gap: 4px;
  }
  .panel-block-title {
    font-family: var(--mono); font-size: 9px; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px;
  }
  .panel-src-row { display: flex; flex-direction: column; gap: 2px; margin-bottom: 8px; }
  .panel-src-sublabel { font-family: var(--mono); font-size: 9px; text-transform: uppercase; letter-spacing: 1px; }
  .panel-src-sublabel.pwr { color: var(--power-color); }
  .panel-src-sublabel.eth { color: var(--eth-color); }
  .panel-source-name {
    font-family: var(--mono); font-size: 13px; color: var(--accent); font-weight: 700;
    cursor: pointer; border-bottom: 1px dashed transparent; transition: border-color 0.15s; display: inline-block;
  }
  .panel-source-name:hover { border-color: var(--accent); }
  .panel-eth-name {
    font-family: var(--mono); font-size: 13px; color: var(--eth-color); font-weight: 700;
    cursor: pointer; border-bottom: 1px dashed transparent; transition: border-color 0.15s; display: inline-block;
  }
  .panel-eth-name:hover { border-color: var(--eth-color); }
  .panel-hint { font-family: var(--mono); font-size: 8px; color: var(--text-dim); margin-top: 6px; }

  /* CHAIN CONNECTOR — arrows between blocks */
  .chain-connector {
    display: flex; flex-direction: column; justify-content: flex-start;
    padding-top: 68px;
    gap: 8px; flex-shrink: 0; width: 40px; position: relative;
  }

  .chain-line {
    height: 3px; width: 100%; position: relative;
  }
  .chain-line.pwr { background: linear-gradient(90deg, var(--power-color), rgba(255,107,53,0.6)); }
  .chain-line.eth { background: linear-gradient(90deg, var(--eth-color),   rgba(74,158,255,0.6)); }
  .chain-line.inactive { background: var(--border); }

  /* Arrowhead at right end */
  .chain-line::after {
    content: ''; position: absolute; right: -1px; top: -3.5px;
    width: 0; height: 0;
    border-top: 5px solid transparent;
    border-bottom: 5px solid transparent;
  }
  .chain-line.pwr::after { border-left: 8px solid var(--power-color); }
  .chain-line.eth::after { border-left: 8px solid var(--eth-color); }
  .chain-line.inactive::after { border-left: 8px solid var(--border); }

  /* Dashed when jumpered */
  .chain-line.jumpered {
    background: none;
    border-top: 3px dashed;
    height: 0;
    margin-top: 1.5px;
  }
  .chain-line.jumpered.pwr { border-color: var(--power-color); }
  .chain-line.jumpered.eth { border-color: var(--eth-color); }

  /* Jump label above connector */
  .chain-connector .jump-label {
    position: absolute; top: 48px; left: 0; width: 100%;
    font-family: var(--mono); font-size: 8px; color: var(--accent);
    text-align: center; white-space: nowrap; letter-spacing: 0;
  }

  /* MODULE CARD */
  .module-card {
    background: var(--surface); border: 1px solid var(--border);
    width: 310px; flex-shrink: 0; position: relative;
    animation: slideIn 0.25s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-8px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  .module-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, var(--accent), transparent);
  }

  .module-header {
    display: flex; align-items: center; padding: 10px 12px; gap: 8px;
    border-bottom: 1px solid var(--border); background: var(--surface2);
  }
  .module-id { font-family: var(--mono); font-size: 9px; color: var(--text-dim); flex-shrink: 0; }
  .module-name-input {
    background: transparent; border: none; border-bottom: 1px dashed var(--border);
    color: var(--text); font-family: var(--mono); font-size: 12px; font-weight: 600;
    flex: 1; padding: 2px 4px; letter-spacing: 1px; text-transform: uppercase;
  }
  .module-name-input:focus { outline: none; border-bottom-color: var(--accent); color: var(--accent); }
  .module-delete {
    background: none; border: none; color: var(--text-dim); cursor: pointer;
    font-size: 13px; padding: 2px 4px; transition: color 0.15s;
  }
  .module-delete:hover { color: var(--danger); }

  /* CONN PORTS section */
  .conn-ports {
    display: grid; grid-template-columns: 1fr 1fr;
    border-bottom: 1px solid var(--border);
  }
  .conn-group {
    padding: 8px 10px; border-right: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 5px;
  }
  .conn-group:last-child { border-right: none; }

  .conn-group-title {
    font-family: var(--mono); font-size: 9px;
    text-transform: uppercase; letter-spacing: 1px; margin-bottom: 1px;
  }
  .conn-group-title.pwr { color: var(--power-color); }
  .conn-group-title.eth { color: var(--eth-color); }

  .port-row { display: flex; align-items: center; gap: 5px; }

  .port-badge {
    font-family: var(--mono); font-size: 8px;
    padding: 1px 4px; border: 1px solid; text-transform: uppercase; flex-shrink: 0;
  }
  .port-badge.p-in  { border-color: rgba(255,107,53,0.5); color: var(--power-color); background: rgba(255,107,53,0.06); }
  .port-badge.p-out { border-color: rgba(255,107,53,0.5); color: var(--power-color); background: rgba(255,107,53,0.06); }
  .port-badge.e-in  { border-color: rgba(74,158,255,0.5); color: var(--eth-color);   background: rgba(74,158,255,0.06); }
  .port-badge.e-out { border-color: rgba(74,158,255,0.5); color: var(--eth-color);   background: rgba(74,158,255,0.06); }

  .port-name-editable {
    font-family: var(--mono); font-size: 10px; color: var(--text-dim);
    cursor: pointer; border-bottom: 1px dashed transparent; transition: all 0.15s;
    flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .port-name-editable:hover { border-bottom-color: var(--border); color: var(--text); }

  .jumper-row { display: flex; align-items: center; gap: 5px; }
  .jumper-chk {
    appearance: none; width: 26px; height: 13px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 2px; cursor: pointer; position: relative; transition: all 0.2s; flex-shrink: 0;
  }
  .jumper-chk:checked { background: rgba(240,165,0,0.2); border-color: var(--accent); }
  .jumper-chk::after {
    content: ''; position: absolute; top: 2px; left: 2px;
    width: 7px; height: 7px; background: var(--text-dim); transition: all 0.2s;
  }
  .jumper-chk:checked::after { left: 15px; background: var(--accent); }
  .jumper-lbl {
    font-family: var(--mono); font-size: 8px; color: var(--text-dim); text-transform: uppercase;
  }
  .jumper-lbl.on { color: var(--accent); }

  /* IO PORTS */
  .io-ports { padding: 7px; display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }

  .io-port {
    border: 1px solid var(--border); padding: 6px 7px;
    position: relative; transition: border-color 0.15s;
  }
  .io-port.t-input   { border-left: 3px solid var(--info); }
  .io-port.t-output  { border-left: 3px solid var(--accent2); }
  .io-port.t-iolink  { border-left: 3px solid var(--accent); }

  .port-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .port-number { font-family: var(--mono); font-size: 9px; color: var(--text-dim); text-transform: uppercase; }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; }
  .io-port.t-input  .status-dot { background: var(--info);    box-shadow: 0 0 4px var(--info); }
  .io-port.t-output .status-dot { background: var(--accent2); box-shadow: 0 0 4px var(--accent2); }
  .io-port.t-iolink .status-dot { background: var(--accent);  box-shadow: 0 0 4px var(--accent); }

  .port-type-select {
    font-family: var(--mono); font-size: 10px;
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); padding: 2px 4px; width: 100%; margin-bottom: 4px; cursor: pointer;
  }

  .device-row { display: flex; align-items: center; gap: 5px; margin-bottom: 4px; }
  .device-icon { width: 24px; height: 24px; flex-shrink: 0; }
  .port-device-select {
    font-family: var(--mono); font-size: 9px;
    background: rgba(240,165,0,0.07); border: 1px solid rgba(240,165,0,0.3);
    color: var(--accent); padding: 2px 3px; flex: 1; cursor: pointer;
  }

  .port-name-input {
    font-family: var(--mono); font-size: 10px;
    background: transparent; border: none; border-bottom: 1px dashed var(--border);
    color: var(--text); padding: 2px; width: 100%;
  }
  .port-name-input:focus { outline: none; border-bottom-color: var(--accent); color: var(--accent); }
  .port-name-input::placeholder { color: var(--text-dim); font-style: italic; }

  /* Add btn at end of chain */
  .add-module-btn {
    display: flex; align-items: center; justify-content: center;
    width: 44px; align-self: stretch; min-height: 100px;
    background: var(--surface2); border: 1px dashed var(--border);
    color: var(--text-dim); font-size: 22px; cursor: pointer;
    flex-shrink: 0; transition: all 0.15s; margin-left: 0;
  }
  .add-module-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(240,165,0,0.05); }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="header-brand">
      <div class="logo-mark">IOL</div>
      <div>
        <h1>IO-Link Troubleshooter</h1>
        <p>Network Diagnostic Flow Diagram</p>
      </div>
    </div>
    <div class="header-controls">
      <button class="btn primary" onclick="addModule()">+ Add Module</button>
      <button class="btn" onclick="saveLayout()">Export JSON</button>
      <button class="btn" onclick="importLayout()">Import JSON</button>
    </div>
  </header>

  <main>
    <div class="legend">
      <span class="legend-title">Legend:</span>
      <span class="legend-item"><span class="legend-dot" style="background:#4a9eff;box-shadow:0 0 4px #4a9eff"></span> Input Port</span>
      <span class="legend-item"><span class="legend-dot" style="background:#00d4aa;box-shadow:0 0 4px #00d4aa"></span> Output Port</span>
      <span class="legend-item"><span class="legend-dot" style="background:#f0a500;box-shadow:0 0 4px #f0a500"></span> IO-Link Device</span>
      <span class="legend-item"><span class="legend-dash" style="border-color:#ff6b35"></span>Power flow (Port 1 → Port 2)</span>
      <span class="legend-item"><span class="legend-dash" style="border-color:#4a9eff"></span>Ethernet flow (Port 1 → Port 2)</span>
      <span class="legend-item" style="margin-left:auto;font-size:10px;color:var(--text-dim);">Port 1 = IN from previous &nbsp;|&nbsp; Port 2 = OUT to next (enable jumper) &nbsp;|&nbsp; Click any name to rename</span>
    </div>

    <div class="flow-area" id="flow-area"></div>
  </main>
</div>

<script>
let modules = [];
let moduleIdCounter = 0;

const DEVICE_ICONS = {
  'None': `<svg viewBox="0 0 24 24" fill="none" stroke="#8b949e" stroke-width="1.5" xmlns="http://www.w3.org/2000/svg">
    <circle cx="12" cy="12" r="9"/><line x1="9" y1="12" x2="15" y2="12"/>
  </svg>`,

  'Touch Button Light': `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="12" cy="9" r="5" fill="rgba(240,165,0,0.12)" stroke="#f0a500" stroke-width="1.5"/>
    <circle cx="12" cy="9" r="2.5" fill="#f0a500"/>
    <path d="M9 16 Q12 13.5 15 16" stroke="#f0a500" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <line x1="12" y1="14" x2="12" y2="16" stroke="#f0a500" stroke-width="1.5"/>
    <line x1="9.5" y1="19" x2="14.5" y2="19" stroke="#f0a500" stroke-width="1.5" stroke-linecap="round"/>
  </svg>`,

  'Rail & Status Light': `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="2" y="9" width="20" height="7" rx="1.5" fill="rgba(0,212,170,0.08)" stroke="#00d4aa" stroke-width="1.2"/>
    <circle cx="6.5"  cy="12.5" r="2" fill="#00d4aa"/>
    <circle cx="12"   cy="12.5" r="2" fill="#f0a500"/>
    <circle cx="17.5" cy="12.5" r="2" fill="#ff4757"/>
    <line x1="2" y1="7" x2="22" y2="7"   stroke="#00d4aa" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="2" y1="18" x2="22" y2="18" stroke="#00d4aa" stroke-width="1.8" stroke-linecap="round"/>
  </svg>`,

  'RFID Sensor': `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="8" y="8" width="8" height="8" rx="1.5" fill="rgba(74,158,255,0.12)" stroke="#4a9eff" stroke-width="1.2"/>
    <circle cx="12" cy="12" r="1.8" fill="#4a9eff"/>
    <path d="M5.5 7.5 Q5.5 3 12 3 Q18.5 3 18.5 7.5" stroke="#4a9eff" stroke-width="1.2" fill="none" opacity="0.5"/>
    <path d="M5.5 16.5 Q5.5 21 12 21 Q18.5 21 18.5 16.5" stroke="#4a9eff" stroke-width="1.2" fill="none" opacity="0.5"/>
    <path d="M3 10 Q3 5.5 12 5.5 Q21 5.5 21 10" stroke="#4a9eff" stroke-width="1" fill="none" opacity="0.3" stroke-dasharray="2 1.5"/>
    <path d="M3 14 Q3 18.5 12 18.5 Q21 18.5 21 14" stroke="#4a9eff" stroke-width="1" fill="none" opacity="0.3" stroke-dasharray="2 1.5"/>
  </svg>`
};

const DEVICE_TYPES = ['None', 'Touch Button Light', 'Rail & Status Light', 'RFID Sensor'];
const PORT_TYPES   = ['Input', 'Output', 'IO-Link'];

function createModule() {
  moduleIdCounter++;
  return {
    id: moduleIdCounter,
    name: `Module ${moduleIdCounter}`,
    pwr1Name: 'PWR IN',   // Port 1 — power input
    pwr2Name: 'PWR OUT',  // Port 2 — power output (jumper to next)
    pwr2Jumpered: false,
    eth1Name: 'ETH IN',   // Port 1 — eth input
    eth2Name: 'ETH OUT',  // Port 2 — eth output (jumper to next)
    eth2Jumpered: false,
    ports: Array.from({length: 8}, (_, i) => ({
      number: i + 1,
      type: 'Input',
      device: 'None',
      name: ''
    }))
  };
}

function renderAll() {
  const area = document.getElementById('flow-area');
  area.innerHTML = '';

  area.appendChild(buildPanelBlock());

  modules.forEach((mod, idx) => {
    // Connector: look at PREVIOUS module's jumper state (or always connected from panel)
    const prevJumpedPwr = idx === 0 ? true : modules[idx - 1].pwr2Jumpered;
    const prevJumpedEth = idx === 0 ? true : modules[idx - 1].eth2Jumpered;
    area.appendChild(buildConnector(prevJumpedPwr, prevJumpedEth));
    area.appendChild(buildModuleCard(mod));
  });

  const addBtn = document.createElement('div');
  addBtn.className = 'add-module-btn';
  addBtn.title = 'Add module';
  addBtn.textContent = '+';
  addBtn.onclick = addModule;
  area.appendChild(addBtn);
}

function buildPanelBlock() {
  const div = document.createElement('div');
  div.className = 'panel-block';

  const title = document.createElement('div');
  title.className = 'panel-block-title';
  title.textContent = 'Network Source';
  div.appendChild(title);

  // Power source
  const pwrRow = document.createElement('div');
  pwrRow.className = 'panel-src-row';
  const pwrLbl = document.createElement('div');
  pwrLbl.className = 'panel-src-sublabel pwr';
  pwrLbl.textContent = '⚡ Power';
  const pwrName = document.createElement('div');
  pwrName.className = 'panel-source-name';
  pwrName.id = 'panel-pwr-name';
  pwrName.textContent = 'PANEL';
  pwrName.title = 'Click to rename';
  pwrName.onclick = () => {
    const n = prompt('Rename power source:', pwrName.textContent);
    if (n?.trim()) pwrName.textContent = n.trim().toUpperCase();
  };
  pwrRow.appendChild(pwrLbl);
  pwrRow.appendChild(pwrName);
  div.appendChild(pwrRow);

  // Ethernet source
  const ethRow = document.createElement('div');
  ethRow.className = 'panel-src-row';
  const ethLbl = document.createElement('div');
  ethLbl.className = 'panel-src-sublabel eth';
  ethLbl.textContent = '⬡ Ethernet';
  const ethName = document.createElement('div');
  ethName.className = 'panel-eth-name';
  ethName.id = 'panel-eth-name';
  ethName.textContent = 'SWITCH';
  ethName.title = 'Click to rename';
  ethName.onclick = () => {
    const n = prompt('Rename ethernet source:', ethName.textContent);
    if (n?.trim()) ethName.textContent = n.trim().toUpperCase();
  };
  ethRow.appendChild(ethLbl);
  ethRow.appendChild(ethName);
  div.appendChild(ethRow);

  const hint = document.createElement('div');
  hint.className = 'panel-hint';
  hint.textContent = 'Click name to rename';
  div.appendChild(hint);

  return div;
}

function buildConnector(pwrActive, ethActive) {
  const wrap = document.createElement('div');
  wrap.className = 'chain-connector';

  const pwrLine = document.createElement('div');
  pwrLine.className = `chain-line pwr${pwrActive ? '' : ' inactive'}`;

  const ethLine = document.createElement('div');
  ethLine.className = `chain-line eth${ethActive ? '' : ' inactive'}`;

  wrap.appendChild(pwrLine);
  wrap.appendChild(ethLine);
  return wrap;
}

function buildModuleCard(mod) {
  const card = document.createElement('div');
  card.className = 'module-card';
  card.dataset.modId = mod.id;

  // Header
  const hdr = document.createElement('div');
  hdr.className = 'module-header';
  const idSpan = document.createElement('span');
  idSpan.className = 'module-id';
  idSpan.textContent = `#${mod.id}`;
  const nameInp = document.createElement('input');
  nameInp.className = 'module-name-input';
  nameInp.value = mod.name;
  nameInp.oninput = e => { mod.name = e.target.value; };
  const delBtn = document.createElement('button');
  delBtn.className = 'module-delete';
  delBtn.innerHTML = '✕';
  delBtn.onclick = () => { modules = modules.filter(m => m.id !== mod.id); renderAll(); };
  hdr.appendChild(idSpan);
  hdr.appendChild(nameInp);
  hdr.appendChild(delBtn);
  card.appendChild(hdr);

  // Connection ports
  const connPorts = document.createElement('div');
  connPorts.className = 'conn-ports';
  connPorts.appendChild(buildConnGroup(mod, 'pwr'));
  connPorts.appendChild(buildConnGroup(mod, 'eth'));
  card.appendChild(connPorts);

  // IO Ports
  const ioSection = document.createElement('div');
  ioSection.className = 'io-ports';
  mod.ports.forEach(port => ioSection.appendChild(buildIOPort(port)));
  card.appendChild(ioSection);

  return card;
}

function buildConnGroup(mod, type) {
  const isPwr = type === 'pwr';
  const group = document.createElement('div');
  group.className = 'conn-group';

  const title = document.createElement('div');
  title.className = `conn-group-title ${type}`;
  title.textContent = isPwr ? '⚡ Power' : '⬡ Ethernet';
  group.appendChild(title);

  // Port 1 — IN
  {
    const row = document.createElement('div');
    row.className = 'port-row';
    const badge = document.createElement('span');
    badge.className = `port-badge ${isPwr ? 'p-in' : 'e-in'}`;
    badge.textContent = 'P1 IN';
    const nameKey = isPwr ? 'pwr1Name' : 'eth1Name';
    const nameEl = document.createElement('span');
    nameEl.className = 'port-name-editable';
    nameEl.textContent = mod[nameKey];
    nameEl.title = 'Click to rename';
    nameEl.onclick = () => {
      const n = prompt('Rename port:', mod[nameKey]);
      if (n?.trim()) { mod[nameKey] = n.trim(); renderAll(); }
    };
    row.appendChild(badge);
    row.appendChild(nameEl);
    group.appendChild(row);
  }

  // Port 2 — OUT
  {
    const row = document.createElement('div');
    row.className = 'port-row';
    const badge = document.createElement('span');
    badge.className = `port-badge ${isPwr ? 'p-out' : 'e-out'}`;
    badge.textContent = 'P2 OUT';
    const nameKey = isPwr ? 'pwr2Name' : 'eth2Name';
    const nameEl = document.createElement('span');
    nameEl.className = 'port-name-editable';
    nameEl.textContent = mod[nameKey];
    nameEl.title = 'Click to rename';
    nameEl.onclick = () => {
      const n = prompt('Rename port:', mod[nameKey]);
      if (n?.trim()) { mod[nameKey] = n.trim(); renderAll(); }
    };
    row.appendChild(badge);
    row.appendChild(nameEl);
    group.appendChild(row);
  }

  // Jumper toggle on Port 2
  const jumperKey = isPwr ? 'pwr2Jumpered' : 'eth2Jumpered';
  const jRow = document.createElement('div');
  jRow.className = 'jumper-row';
  const chk = document.createElement('input');
  chk.type = 'checkbox';
  chk.className = 'jumper-chk';
  chk.checked = mod[jumperKey];
  chk.onchange = e => { mod[jumperKey] = e.target.checked; renderAll(); };
  const jLbl = document.createElement('span');
  jLbl.className = `jumper-lbl${mod[jumperKey] ? ' on' : ''}`;
  jLbl.textContent = mod[jumperKey] ? '↗ JUMPER ON' : 'JUMPER OFF';
  jRow.appendChild(chk);
  jRow.appendChild(jLbl);
  group.appendChild(jRow);

  return group;
}

function buildIOPort(port) {
  const cls = port.type === 'IO-Link' ? 't-iolink' : `t-${port.type.toLowerCase()}`;
  const div = document.createElement('div');
  div.className = `io-port ${cls}`;

  const top = document.createElement('div');
  top.className = 'port-top';
  const num = document.createElement('span');
  num.className = 'port-number';
  num.textContent = `Port ${port.number}`;
  const dot = document.createElement('div');
  dot.className = 'status-dot';
  top.appendChild(num);
  top.appendChild(dot);
  div.appendChild(top);

  const typeSelect = document.createElement('select');
  typeSelect.className = 'port-type-select';
  PORT_TYPES.forEach(t => {
    const opt = document.createElement('option');
    opt.value = t;
    opt.textContent = t;
    if (t === port.type) opt.selected = true;
    typeSelect.appendChild(opt);
  });
  typeSelect.onchange = e => {
    port.type = e.target.value;
    if (port.type !== 'IO-Link') port.device = 'None';
    renderAll();
  };
  div.appendChild(typeSelect);

  if (port.type === 'IO-Link') {
    const devRow = document.createElement('div');
    devRow.className = 'device-row';

    const iconDiv = document.createElement('div');
    iconDiv.className = 'device-icon';
    iconDiv.innerHTML = DEVICE_ICONS[port.device] || DEVICE_ICONS['None'];

    const devSelect = document.createElement('select');
    devSelect.className = 'port-device-select';
    DEVICE_TYPES.forEach(d => {
      const opt = document.createElement('option');
      opt.value = d;
      opt.textContent = d === 'None' ? '— Select device' : d;
      if (d === port.device) opt.selected = true;
      devSelect.appendChild(opt);
    });
    devSelect.onchange = e => {
      port.device = e.target.value;
      iconDiv.innerHTML = DEVICE_ICONS[port.device] || DEVICE_ICONS['None'];
      // no full re-render needed, icon updated inline
    };

    devRow.appendChild(iconDiv);
    devRow.appendChild(devSelect);
    div.appendChild(devRow);
  }

  const nameInp = document.createElement('input');
  nameInp.className = 'port-name-input';
  nameInp.placeholder = port.type === 'IO-Link' ? 'Label device...' : 'Label port...';
  nameInp.value = port.name;
  nameInp.oninput = e => { port.name = e.target.value; };
  div.appendChild(nameInp);

  return div;
}

function addModule() {
  modules.push(createModule());
  renderAll();
}

function saveLayout() {
  const json = JSON.stringify(modules, null, 2);
  const blob = new Blob([json], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'iolink-layout.json';
  a.click();
}

function importLayout() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = e => {
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = evt => {
      try {
        modules = JSON.parse(evt.target.result);
        moduleIdCounter = Math.max(...modules.map(m => m.id), 0);
        renderAll();
      } catch { alert('Invalid JSON file.'); }
    };
    reader.readAsText(file);
  };
  input.click();
}

addModule();
addModule();
</script>
</body>
</html>
