<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>Combined Work Tools Mobile</title>
<script src="https://cdn.jsdelivr.net/npm/pocketbase@0.21.3/dist/pocketbase.umd.js"></script>
<style>
:root{--bg:#0b0f14;--panel:#131a22;--p2:#1b2631;--bd:#2b3d4d;--t:#eaf0f5;--m:#91a2b1;--a:#4a9eff;--g:#00d4aa;--r:#ff6575}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Segoe UI,system-ui,sans-serif}
button,input{font:inherit}header{position:sticky;top:0;z-index:10;background:var(--panel);border-bottom:1px solid var(--bd);padding:12px}
h1{font-size:17px;margin:0;color:var(--a)}.sub{font-size:11px;color:var(--m);margin-top:2px}.live{color:var(--g)}.stale{color:var(--r)}
.head{display:flex;gap:8px;align-items:center}.sp{flex:1}.btn,.nav button{background:var(--p2);color:var(--t);border:1px solid var(--bd);border-radius:6px;padding:9px 7px}
.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:8px;background:#0e141b}.nav button.on{background:#17385b;border-color:var(--a)}
.page{display:none;padding:10px 10px 80px}.page.on{display:block}.card{background:var(--panel);border:1px solid var(--bd);border-radius:9px;padding:11px;margin:8px 0}
.small{font-size:11px;color:var(--m)}.state{font-size:10px;border:1px solid var(--bd);border-radius:999px;padding:4px 7px}.good{color:#7ce2bb}.bad{color:#ff7d86}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.metric{background:#0e151c;border:1px solid #263746;border-radius:6px;padding:8px;text-align:center}.metric b{display:block;color:var(--a);font-size:15px}.metric span{font-size:9px;color:var(--m)}
.row{padding:7px 0;border-bottom:1px solid #253543;font-size:12px}.fault{color:#ff9aa2}.empty{text-align:center;padding:35px;color:var(--m);border:1px dashed var(--bd);border-radius:8px}
.settings{position:fixed;inset:0;background:#000b;display:none;z-index:50;padding:12px;overflow:auto}.settings.on{display:block}.sheet{max-width:620px;margin:20px auto;background:var(--panel);border:1px solid var(--bd);border-radius:10px;padding:14px}
label{display:block;font-size:10px;color:var(--m);margin:9px 0 4px}input{width:100%;background:#0e151c;color:var(--t);border:1px solid var(--bd);border-radius:6px;padding:10px}.actions{display:flex;gap:7px;margin-top:12px}
.actions button{background:#243341;color:#fff;border:1px solid var(--bd);border-radius:6px;padding:9px 11px}
</style>
</head>
<body>
<header><div class="head"><div><h1>DELKOR WORK TOOLS</h1><div class="sub">PocketBase Mobile View</div></div><div class="sp"></div><button class="btn" onclick="openSettings()">Settings</button></div><div id="status" class="sub">Not configured</div></header>
<div class="nav"><button data-page="machines" class="on">Machines</button><button data-page="downtime">Downtime</button><button data-page="connections">PLC</button><button data-page="trends">Tag Trends</button></div>
<section id="machines" class="page on"><div id="machineList" class="empty">Configure PocketBase in Settings.</div></section>
<section id="downtime" class="page"><div id="downList"></div></section>
<section id="connections" class="page"><div id="connList"></div></section>
<section id="trends" class="page"><div id="trendList"></div></section>
<div id="settings" class="settings"><div class="sheet"><h2>Mobile Source</h2><label>PocketBase URL</label><input id="pbUrl" placeholder="https://..."><label>Collection</label><input id="pbCollection" value="combined_mobile_sites"><label>Site ID</label><input id="siteId" value="customer-site"><div class="actions"><button onclick="settings.classList.remove('on')">Cancel</button><button onclick="saveSettings()">Save & Connect</button></div><div class="small" style="margin-top:10px">Settings are saved only in this browser.</div></div></div>
<script>
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>{if(c==="&")return "&amp;";if(c==="<")return "&lt;";if(c===">")return "&gt;";if(c.charCodeAt(0)===34)return "&quot;";return "&#39;"});
let cfg=JSON.parse(localStorage.getItem("combinedMobileCfg")||"{}");
function sec(v){v=Math.max(0,Number(v)||0);const h=Math.floor(v/3600),m=Math.floor(v%3600/60);return `${h}h ${m}m`}
function openSettings(){pbUrl.value=cfg.url||"";pbCollection.value=cfg.collection||"combined_mobile_sites";siteId.value=cfg.site_id||"customer-site";settings.classList.add("on")}
function saveSettings(){cfg={url:pbUrl.value.trim().replace(/\/$/,""),collection:pbCollection.value.trim()||"combined_mobile_sites",site_id:siteId.value.trim()||"customer-site"};localStorage.setItem("combinedMobileCfg",JSON.stringify(cfg));settings.classList.remove("on");load()}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".nav button").forEach(x=>x.classList.toggle("on",x===b));document.querySelectorAll(".page").forEach(x=>x.classList.toggle("on",x.id===b.dataset.page))});
function parse(v,fallback){try{return JSON.parse(v||"")}catch(e){return fallback}}
async function load(){
 if(!cfg.url){status.textContent="Not configured";return}
 try{
  const pb=new PocketBase(cfg.url);pb.autoCancellation(false);
  pb.beforeSend=function(url,options){options.headers=Object.assign({},options.headers,{"ngrok-skip-browser-warning":"true"});return {url,options}};
  const filter=`site_id="${String(cfg.site_id).replace(/"/g,"")}"`;
  const r=await pb.collection(cfg.collection).getFirstListItem(filter,{requestKey:null});
  const age=Math.max(0,Date.now()/1000-Number(r.heartbeat_epoch||0));
  status.className="sub "+(age<15?"live":"stale");
  status.textContent=(age<15?"● LIVE":"● CONNECTION LOST")+` · ${r.site_name||cfg.site_id} · updated ${Math.round(age)}s ago`;
  renderMachines(parse(r.machines_json,{}));renderDown(parse(r.downtime_json,{}));renderConnections(parse(r.connections_json,[]));renderTrends(parse(r.plc_trends_json,[]));
 }catch(e){status.className="sub stale";status.textContent="PocketBase error: "+e.message}
}
function renderMachines(data){const ovs=data.overview?.overview||[],machines=data.machines||[];machineList.innerHTML=ovs.length?ovs.map(ov=>{const m=machines.find(x=>x.id===ov.id),d=m?.data||{},recipes=Object.entries(d.recipes||{}),faults=m?.faults||[];return `<article class="card"><div class="head"><b>${esc(ov.name)}</b><div class="sp"></div><span class="state ${d.status?.state==="running"?"good":"bad"}">${esc(d.status?.message||ov.status_message||"")}</span></div><div class="small">${esc(ov.line_name||"")}</div><div class="metrics"><div class="metric"><b>${esc(d.current_recipe||"—")}</b><span>RECIPE</span></div><div class="metric"><b>${sec(ov.total_runtime)}</b><span>RUNTIME</span></div><div class="metric"><b>${Number(ov.total_parts||0).toLocaleString()}</b><span>PARTS</span></div></div>${recipes.slice(0,10).map(([n,x])=>`<div class="row"><b>${esc(n)}</b> · Run ${sec(x.runtime)} · Down ${sec(x.downtime)} · ${Number(x.total||0).toLocaleString()} parts</div>`).join("")}${faults.slice(-5).reverse().map(f=>`<div class="row fault">#${esc(f.number)} ${esc(f.message)} <span class="small">${esc(f.timestamp||"")}</span></div>`).join("")}</article>`}).join(""):`<div class="empty">No machine data.</div>`}
function renderDown(data){const tags=data.tags||[];downList.innerHTML=tags.length?tags.map(t=>`<article class="card"><div class="head"><b>${esc(t.name)}</b><div class="sp"></div><span class="state ${t.is_active?"bad":"good"}">${esc(t.status||"")}</span></div><div class="small">${esc(t.plc_tag||"")}</div><div class="metrics"><div class="metric"><b>${sec(t.total_seconds)}</b><span>DOWNTIME</span></div><div class="metric"><b>${Number(t.occurrence_count||0)}</b><span>OCCURRENCES</span></div><div class="metric"><b>${t.last_value==null?"—":esc(t.last_value)}</b><span>VALUE</span></div></div></article>`).join(""):`<div class="empty">No downtime trackers.</div>`}
function renderConnections(list){connList.innerHTML=list.length?list.map(p=>`<article class="card"><div class="head"><b>${esc(p.name)}</b><div class="sp"></div><span class="state">${esc(p.mode)}</span></div><div class="small">Target ${esc(p.target_ip)}${p.mode==="routed"?` · Gateway ${esc(p.gateway_ip)} · Port ${esc(p.cip_port)} · Slot ${esc(p.processor_slot)}`:""}</div></article>`).join(""):`<div class="empty">No PLC connections.</div>`}
function renderTrends(list){trendList.innerHTML=list.length?list.map(t=>`<article class="card"><div class="head"><b>${esc(t.chart_name||"Trend 1")} · ${esc(t.name)}</b><div class="sp"></div><span class="state ${t.status==="Monitoring"?"good":"bad"}">${esc(t.status)}</span></div><div class="small">${esc(t.tag)} · ${esc(t.ip)}</div><div class="metrics"><div class="metric"><b>${esc(t.current_text??"—")}</b><span>CURRENT</span></div><div class="metric"><b>${t.minimum==null?"—":Number(t.minimum).toFixed(2)}</b><span>MIN</span></div><div class="metric"><b>${t.maximum==null?"—":Number(t.maximum).toFixed(2)}</b><span>MAX</span></div></div></article>`).join(""):`<div class="empty">No PLC tag trends.</div>`}
if(cfg.url)load();else openSettings();setInterval(load,5000);
</script>
</body></html>
